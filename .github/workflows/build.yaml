name: Cross-Platform Build with PyInstaller

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build:
    needs: check-format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            target: linux
            runs-on: ubuntu-latest
          - os: windows-latest
            python-version: '3.11'
            target: windows
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyInstaller for Windows
        if: matrix.os == 'windows-latest'
        run: python -m pip install pyinstaller==6.19.0

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install -r requirements-win.txt

      - name: Verify Windows OCR dependency
        if: matrix.os == 'windows-latest'
        run: python -c "import tesserocr, tesserocr.cysignals.signals; print(tesserocr.tesseract_version())"

      - name: Write .env file Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "LOCAL_RELEASE_TAG=${GITHUB_REF_NAME}" >> .env
          echo "LOCAL_RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> .env

      - name: Write .env file Windows
        if: matrix.os == 'windows-latest'
        run: |
          @"
          LOCAL_RELEASE_TAG=$env:GITHUB_REF_NAME
          LOCAL_RELEASE_DATE=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          "@ | Out-File -FilePath .env -Encoding ASCII
        shell: pwsh

      - name: Build device enumeration module on Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd src/win32DeviceEnum
          python setup.py build_ext --inplace
          cd ../..

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --clean --noconfirm scoresight.spec -- --win

      - name: Smoke test packaged Windows imports and OCR
        if: matrix.os == 'windows-latest'
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "scoresight-import-check.txt"
          Remove-Item $resultPath -ErrorAction Ignore
          $env:SCORESIGHT_IMPORT_CHECK_RESULT = $resultPath
          & .\dist\scoresight\scoresight.exe --check-imports
          $exitCode = $LASTEXITCODE
          if (Test-Path $resultPath) {
            $result = Get-Content -Path $resultPath -Raw
            Write-Output $result
          }
          if ($exitCode -ne 0) { exit $exitCode }
          if (!(Test-Path $resultPath) -or $result -ne "imports-ok") {
            throw "Packaged application import and OCR smoke test did not report success."
          }
        shell: pwsh

      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --clean --noconfirm scoresight.spec

      - name: Add version to .iss file
        if: matrix.os == 'windows-latest'
        run: |
          $version = (Get-Content -Path scoresight.iss -Raw) -replace '@SCORESIGHT_VERSION@', $env:GITHUB_REF_NAME
          $version | Out-File -FilePath scoresight.iss -Encoding ASCII
        shell: pwsh

      - name: Compile .ISS to .EXE Installer
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: scoresight.iss
          options: /O+

      - name: Prepare portable Windows app
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -Path dist/scoresight/scoresight.portable -ItemType File -Force | Out-Null
          @"
          ScoreSight portable build

          Extract this folder to a USB drive and run scoresight.exe. No installer is needed.
          Settings and logs are saved in the data folder beside the executable when the drive is writable.
          If the drive is read-only, ScoreSight uses your normal Windows user data folder.
          "@ | Out-File -FilePath dist/scoresight/README-portable.txt -Encoding utf8
        shell: pwsh

      - name: Create tar Linux
        if: matrix.os == 'ubuntu-latest'
        # strip the folder name from the tar
        run: |
          chmod a+x dist/scoresight
          tar -cvf scoresight.tar -C dist scoresight

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scoresight-windows-installer
          path: dist/scoresight-setup.exe

      - name: Upload portable Windows app
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scoresight-windows-portable
          path: dist/scoresight

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scoresight-linux
          path: scoresight.tar
